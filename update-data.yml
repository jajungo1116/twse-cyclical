name: Update Stock Data Daily

on:
  schedule:
    # 台股收盤後執行 (UTC 06:00 = 台灣時間 14:00)
    # 排在 14:30 確保收盤資料已更新
    - cron: '30 6 * * 1-5'
  # 允許手動觸發 (測試用)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest stock data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python fetch_data.py

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # 只有資料變動才 commit
          git diff --staged --quiet || git commit -m "📊 Auto-update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
